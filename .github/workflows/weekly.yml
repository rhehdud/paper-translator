name: Weekly paper processing

on:
  schedule:
    # 매주 토요일 09:00 KST(=00:00 UTC) 시작.
    # 월요일 09:03 KST 배포·알림(publish_and_notify.yml)까지 48시간 버퍼를 둬서(예전 33시간에서
    # 늘림 - extract에 marker --use_llm이 붙으면서 추출 단계만으로도 카테고리당 1시간 안팎이
    # 걸리기 시작해, 5개 분야 추출 + 5개 분야 번역이 순차로 이어지는 전체 체인이 예전보다
    # 훨씬 길어질 수 있음) 처리 시간이 언제 끝나든 다음 주 실행과 겹치지 않게 함.
    # 이 워크플로가 끝나면 (성공 시) extract_ai.yml이 workflow_run으로 자동으로 이어받아
    # extract_ai -> ... -> extract_ro -> translate_ai -> ... -> translate_ro -> finalize_translate
    # 순으로 체인이 이어진다 (분야마다 완전히 분리된 워크플로 - 하나의 워크플로에서 matrix로
    # 돌리면 workflow_run 3단계 제한, 같은 실행의 정적 checkout 공유로 인한 git push 레이스,
    # 공용 NVIDIA 무료 티어 동시 경합 문제가 반복된다는 걸 이미 여러 번 겪었다).
    - cron: "0 0 * * 6"
  workflow_dispatch: {}

concurrency:
  group: weekly-paper-processing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - run: pip install -r requirements-collect.txt

      - run: python src/collect.py --out-dir selected

      - uses: actions/upload-artifact@v7
        with:
          name: selected-papers
          path: selected/
