name: Translate (cs_CL)

on:
  # 앞 분야(cs_AI)가 gh workflow run으로 직접 트리거한다 (workflow_run 체이닝은 3단계
  # 제한이 있어서 안 씀 - weekly->ai->cl->cv까지는 되고 그 다음부터 안 되는 걸 실제로 겪음).
  workflow_dispatch:
    inputs:
      run_id:
        description: "번역할 대상 'Weekly paper processing' 실행 ID (비우면 가장 최근 성공 실행)"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  translate:
    uses: ./.github/workflows/_translate_category.yml
    with:
      category: cs_CL
      run_id: ${{ github.event.inputs.run_id || '' }}
    secrets: inherit

  trigger_next:
    needs: translate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 다음 분야(cs_CV) 트리거
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run translate_cv.yml --repo "${{ github.repository }}" \
            -f run_id="${{ needs.translate.outputs.run_id }}"
