name: Translate (cs_AI)

on:
  # 앞 단계(Extract (cs_RO))가 gh workflow run으로 직접 트리거한다. 예전엔 여기가
  # "Weekly paper processing" 완료를 workflow_run으로 직접 받는 체인의 시작점이었지만,
  # 추출(extract)도 분야별로 완전히 분리되면서 그 체인의 마지막(Extract (cs_RO))이
  # 이 자리를 넘겨받았다.
  workflow_dispatch:
    inputs:
      run_id:
        description: "번역할 대상 'Weekly paper processing' 실행 ID (비우면 가장 최근 성공 실행)"
        required: false

permissions:
  contents: write
  actions: write # 다음 분야 워크플로를 gh workflow run으로 직접 트리거하려면 write 필요

jobs:
  translate:
    uses: ./.github/workflows/_translate_category.yml
    with:
      category: cs_AI
      run_id: ${{ github.event.inputs.run_id || '' }}
    secrets: inherit

  # workflow_run 체이닝은 3단계까지만 지원돼서(weekly->ai->cl->cv까지는 되고 그 다음부터
  # 안 됨 - 실제로 겪음), 다음 분야는 여기서 API로 직접 dispatch한다.
  trigger_next:
    needs: translate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 다음 분야(cs_CL) 트리거
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run translate_cl.yml --repo "${{ github.repository }}" \
            -f run_id="${{ needs.translate.outputs.run_id }}"
