name: Extract (cs_AI)

on:
  workflow_run:
    workflows: ["Weekly paper processing"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "대상 'Weekly paper processing' 실행 ID (비우면 가장 최근 성공 실행)"
        required: false

permissions:
  contents: read
  actions: write # 다음 분야 워크플로를 gh workflow run으로 직접 트리거하려면 write 필요

jobs:
  extract:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/_extract_category.yml
    with:
      category: cs_AI
      run_id: ${{ github.event.inputs.run_id || '' }}
    secrets: inherit

  trigger_next:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 다음 분야(cs_CL) 트리거
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run extract_cl.yml --repo "${{ github.repository }}" \
            -f run_id="${{ needs.extract.outputs.run_id }}"
