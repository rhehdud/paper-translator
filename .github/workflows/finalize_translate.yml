name: Finalize translation batch

on:
  # cs_RO가 gh workflow run으로 직접 트리거한다 (workflow_run 체이닝 3단계 제한 때문).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  record_generated_at:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # "이번 주 배치가 언제 마지막으로 갱신됐는지"를 나타내는 단일 타임스탬프라 분야별로
      # 나눌 필요가 없다(notify.py가 신선도 체크·발행일 폴백에 씀). 예전엔 분야별 job이
      # 각자 이 파일을 써서 커밋했는데, 그러면 5개 분야가 전부 같은 파일을 건드리게 돼
      # rebase 시 매번 충돌이 났다. 체인의 맨 마지막에서 딱 한 번만 쓰도록 분리했다.
      - name: 이번 처리 완료 시각 기록
        run: |
          git config user.name "paper-translator-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p data/last_run
          date -u +%Y-%m-%dT%H:%M:%SZ > data/last_run/generated_at.txt
          git add data/last_run/generated_at.txt
          git commit -m "chore: 이번 처리 완료 시각 기록" || echo "커밋할 변경 없음"
          # 이 파일 자체는 이 워크플로만 쓰지만, 겹쳐 도는 다른 체인(예: 주간 cron과
          # 수동 재실행이 겹친 경우)이 그 사이 main에 다른 커밋을 먼저 push했을 수 있어
          # push가 "fetch first"로 거절될 수 있다. rebase로 미리 맞춘다.
          git pull --rebase origin main
          git push
