# 논문 번역·아카이브 봇 설정

categories:
  - code: cs.CL
    name: NLP
  - code: cs.CV
    name: Vision
  - code: cs.LG
    name: ML
  - code: cs.AI
    name: AI General
  - code: cs.RO
    name: Robotics

papers_per_category: 1

# 최근 며칠 내 제출된 논문을 후보로 볼지
candidate_window_days: 7

# arXiv 조회 1페이지당 가져올 개수(페이지네이션 단위). candidate_window_days 전체를
# 커버할 때까지 이 크기로 계속 다음 페이지를 가져온다 - 후보 수를 제한하는 값이 아니다.
candidate_page_size: 200

selection:
  # primary: HF Daily Papers에 업보트로 등재된 후보 중 최고 업보트
  # fallback: 매칭되는 후보가 없으면 최신 제출 논문
  method: hf_daily_papers_upvotes_with_recency_fallback

extraction:
  # 로컬에서 검증된 버전 고정 (최신 버전은 llama-server 바이너리를 요구해 GH Actions에서 실패함)
  marker_pdf_version: "1.10.2"
  # 극단적으로 긴 논문(서베이 등)은 잡 시간 폭주를 막기 위해 상한
  max_pages: 60
  # 표·수식 등 레이아웃이 복잡한 영역은 marker의 규칙 기반 파싱만으로 가끔 깨진다
  # (앵커 태그·표 캡션 붙음 등, 지금 코드에 있는 여러 후처리가 그 흔적). marker의
  # --use_llm으로 페이지 이미지를 직접 보고 재해석하게 하면 이런 걸 줄일 수 있다.
  # translation과 같은 NVIDIA NIM 무료 엔드포인트를 재사용하되, gpt-oss-20b는
  # 텍스트 전용이라 이미지를 못 보므로(직접 확인함) 비전 모델을 따로 지정한다.
  use_llm: true
  llm_model: nvidia/nemotron-nano-12b-v2-vl

translation:
  provider: nvidia_nim
  base_url: https://integrate.api.nvidia.com/v1
  model: openai/gpt-oss-20b
  # 문단 구분자(<<<P>>>) 개수를 안 맞춰서 재시도가 잦아지는 걸 줄이려고 0.2 -> 0에 가깝게 낮춤
  temperature: 0.1
  system_prompt_file: prompts/translate_system.md

publish:
  docs_dir: docs
  site_name: "논문을읽어요"

notify:
  discord_webhook_env: DISCORD_WEBHOOK_URL
